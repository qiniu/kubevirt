name: Pull request validation

on:
  pull_request:
    branches:
      - 7niu-release-1.8
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run linters
        env:
          GOLANGCI_LINT_NEW_FROM_REV: ${{ github.event.pull_request.base.sha }}
        run: make lint

  verify-generated-files:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify generated files
        run: make generate-verify

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run unit tests
        env:
          KUBEVIRT_GIT_VERSION: v0.0.0
        run: make test
