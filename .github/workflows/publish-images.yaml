name: Publish container images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'qiniu/kubevirt'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          BUILD_ARCH: x86_64
          DOCKER_PREFIX: ghcr.io/qiniu
          DOCKER_TAG: ${{ github.ref_name }}
          KUBEVIRT_CRI: docker
          KUBEVIRT_RELEASE: 'true'
        run: make bazel-push-images

      - name: Generate release manifests
        env:
          DOCKER_PREFIX: ghcr.io/qiniu
          DOCKER_TAG: ${{ github.ref_name }}
          KUBEVIRT_CRI: docker
          KUBEVIRT_RELEASE: 'true'
        run: make manifests-no-bazel

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git show "$GITHUB_REF_NAME" --format=format:%n > /tmp/tag_notes
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title="$GITHUB_REF_NAME" \
              --notes-file /tmp/tag_notes
          fi

          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            _out/manifests/release/demo-content.yaml \
            _out/manifests/release/kubevirt-operator.yaml \
            _out/manifests/release/kubevirt-cr.yaml \
            _out/manifests/release/kubevirt-network-policies.yaml \
            _out/manifests/release/olm/kubevirt-operatorsource.yaml \
            "_out/manifests/release/olm/bundle/kubevirtoperator.${GITHUB_REF_NAME}.clusterserviceversion.yaml" \
            _out/manifests/release/conformance.yaml \
            _out/manifests/testing/*
