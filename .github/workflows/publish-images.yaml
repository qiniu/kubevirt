name: Publish container images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'qiniu/kubevirt'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          BUILD_ARCH: x86_64
          DOCKER_PREFIX: ghcr.io/qiniu
          DOCKER_TAG: ${{ github.ref_name }}
          KUBEVIRT_CRI: docker
          KUBEVIRT_RELEASE: 'true'
        run: make bazel-push-images
